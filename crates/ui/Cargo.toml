[package]
name = "apic-ui"
description = "apic: the ui package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
apic-auth = { path = "../auth" }
apic-gocompat = { path = "../gocompat" }
apic-history = { path = "../history" }
apic-httpc = { path = "../httpc" }
apic-httpfile = { path = "../httpfile" }
apic-output = { path = "../output" }
apic-project = { path = "../project" }
apic-runner = { path = "../runner" }
apic-session = { path = "../session" }
apic-snippet = { path = "../snippet" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
apic-demoapi = { path = "../demoapi" }
apic-httpd = { path = "../httpd" }
tempfile.workspace = true
