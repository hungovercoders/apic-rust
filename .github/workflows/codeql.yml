name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published rule is found on a quiet repo too.
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload the results
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          # Rust is analysed from source: there is nothing to build first.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
