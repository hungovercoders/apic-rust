name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository; jobs that need more say so.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml pins, with the registry and
      # target/ cached. The action would otherwise set RUSTFLAGS to deny
      # warnings in every build; clippy in the lint job is where they fail.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Typos in comments, strings and the docs; .codespellrc says what to skip.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "codespell==2.4.3" && codespell

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: test -f LICENSE || (echo "LICENSE is missing" >&2; exit 1)
      # Fails if any crate compiled into a released binary has no licence file.
      - run: sh scripts/notices.sh /tmp/THIRD_PARTY_NOTICES.md
      # Rust's standard library is in every binary, and each crate names
      # where its source is.
      - run: |
          grep -q '^## Rust standard library ' /tmp/THIRD_PARTY_NOTICES.md
          test "$(grep -c '^## ' /tmp/THIRD_PARTY_NOTICES.md)" -eq "$(grep -c '^Source: https://' /tmp/THIRD_PARTY_NOTICES.md)"
      # Fails if any crate's licence is off the permissive list in deny.toml.
      - run: cargo deny check licenses

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # Reports the RustSec advisories that name a crate version in
      # Cargo.lock, which is what the release binaries are built from. The
      # dependency list is short, so a finding here is worth acting on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The course pages and the migration guides on the site (under
  # website/src/content/docs) carry runnable blocks marked with
  # <!-- learn -->; this builds apic, serves the demo API and runs them, so
  # a lesson cannot quietly stop working.
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo run -q --locked -p learncheck

  # The course's VHS tapes parse, the lesson tapes and the ones embedded in
  # the episodes' shot lists alike. vhs alone is enough to validate;
  # recording needs ttyd and ffmpeg too and is a local job (task tapes,
  # task episodes).
  tapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # vhs is a Go program, installed from source: the one step in this
      # workflow that needs Go.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install github.com/charmbracelet/vhs@v0.12.1
      - run: cargo run -q --locked -p tapes -- -check
      - run: cargo run -q --locked -p episodes -- -check

  # The VS Code extension in editors/vscode is the one place Node lives.
  # It is linted, typechecked, bundled, tested in a real VS Code (headless
  # under xvfb, with apic built onto PATH so the binary tests run too) and
  # packaged, with the .vsix kept as an artifact.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: |
          cargo build --release --locked -p apic
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/apic "$RUNNER_TEMP/bin/apic"
        working-directory: .
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: xvfb-run -a npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix

  # The screenshots and the animated demo are generated from real output;
  # rendering them here proves a UI change did not break the generator,
  # and the artifact lets a reviewer look at the frames.
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo run -q --locked -p shot -- -out shots
      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo run -q --locked -p apic -- validate -C examples/httpbin
      - run: cargo run -q --locked -p apic -- validate -C examples/github
      - run: cargo run -q --locked -p apic -- validate -C examples/spotify
      - run: cargo run -q --locked -p apic -- fmt --check -C examples/httpbin
      - run: cargo run -q --locked -p apic -- fmt --check -C examples/github
      - run: cargo run -q --locked -p apic -- fmt --check -C examples/spotify
      - run: |
          cargo build --locked -p apic
          cp target/debug/apic /tmp/apic
          /tmp/apic demo --out /tmp/apic-demo >/tmp/apic-demo.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          i=0
          until [ -f /tmp/apic-demo/apic.yaml ]; do
            i=$((i+1))
            [ $i -ge 100 ] && echo demo scaffold not ready >&2 && exit 1
            sleep 0.1
          done
          /tmp/apic validate -C /tmp/apic-demo

  # The release image, built the way goreleaser lays it out ($TARGETPLATFORM/apic
  # in the context), so a broken Dockerfile shows up here rather than on a tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # The image is FROM scratch, so the binary must be static: the musl
      # target, as the release builds it. musl-tools is the C compiler the
      # ring crate's build needs for that target.
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          mkdir -p ctx/linux/amd64
          cp Dockerfile LICENSE ctx/
          sh scripts/notices.sh ctx/THIRD_PARTY_NOTICES.md
          APIC_VERSION=ci cargo build --release --locked -p apic --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/apic ctx/linux/amd64/apic
          docker buildx build --load --platform linux/amd64 -t apic:ci ctx
          docker run --rm apic:ci version | grep -F "apic ci"
          # Not root, and TLS roots and /tmp are there.
          docker run --rm --user 65534:65534 --entrypoint /apic apic:ci version
          docker create --name probe apic:ci >/dev/null
          docker export probe | tar -t > files.txt
          grep -x 'etc/ssl/certs/ca-certificates.crt' files.txt
          # The licence and notices travel with the binary, as in the archives.
          for f in LICENSE THIRD_PARTY_NOTICES.md CA-CERTIFICATES.md; do grep -x "usr/share/doc/apic/$f" files.txt; done

  # The deb, rpm and apk packages goreleaser builds for a release, installed
  # on the distributions they are for. Signing, SBOMs and the image are
  # skipped: the jobs above cover the image, and a release does the rest.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # goreleaser cross-compiles every release target with cargo-zigbuild
      # (see .goreleaser.yaml): zig is the C compiler and the linker for the
      # targets this runner is not. The pip package brings zig with it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "cargo-zigbuild==0.24.1"
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom,docker
      - name: deb on Ubuntu
        run: |
          sudo dpkg -i dist/apic_*_linux_amd64.deb
          apic version
          man -w apic
          test -f /usr/share/bash-completion/completions/apic
          sudo dpkg -r apic
      - name: rpm on Fedora
        run: docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 sh -c 'rpm -i /dist/apic_*_linux_amd64.rpm && apic version && rpm -ql apic | grep -q man1/apic.1'
      - name: apk on Alpine
        run: docker run --rm -v "$PWD/dist:/dist:ro" alpine:3.22 sh -c 'apk add --no-network --allow-untrusted /dist/apic_*_linux_amd64.apk && apic version'
      - name: The packages are in checksums.txt
        run: test "$(grep -cE '\.(deb|rpm|apk)$' dist/checksums.txt)" -eq 6
      # The Homebrew cask the release would push to the tap: valid Ruby,
      # with a block for each OS and the archive's man pages and completions.
      - name: The Homebrew cask renders
        run: |
          cask=dist/homebrew/Casks/apic.rb
          ruby -c "$cask"
          grep -q '^  on_macos do' "$cask"
          grep -q '^  on_linux do' "$cask"
          grep -q 'manpage "man/apic.1"' "$cask"
          grep -q 'zsh_completion "completions/apic.zsh"' "$cask"
          tar -tzf dist/apic_*_linux_amd64.tar.gz | grep -q '^completions/apic.zsh$'
