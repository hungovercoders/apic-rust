[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hungovercoders/apic-rust"
homepage = "https://apic.sh/"
authors = ["hungovercoders"]
publish = false

# One place for every third-party version. Keep the list small: see
# docs/licensing.md before adding to it.
[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4"
gherkin = { version = "0.16", default-features = false, features = ["parser"] }
gjson = "0.8"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "http1", "http2", "tokio"] }
include_dir = "0.7"
libc = "0.2"
md-5 = "0.10"
percent-encoding = "2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
